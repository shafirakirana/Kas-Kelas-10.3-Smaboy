<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Kas 10.3</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="keuanganstyle.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>
<body>
    <a href="index.html" class="kembali">← Kembali</a>
    <h1 class="judul">KEUANGAN KELAS</h1>
    <p class="sub-judul">Arus Pemasukan & Pengeluaran Kas 10.3</p>

    <div class="ringkasan-container">
        <div class="card-stat">
            <span class="stat-label">Total Sisa Saldo Kas</span>
            <h3 id="statSisaSaldo">Rp 0</h3>
        </div>
    </div>

    <div id="formContainer" class="form-card akses-bendahara">
        <h3>+ TAMBAH TRANSAKSI</h3>
        <form id="formTransaksi">
            
            <div class="tipe-switch">
                <input type="radio" id="tipePemasukan" name="tipeTransaksi" value="pemasukan" checked>
                <label for="tipePemasukan" class="label-pemasukan">+ Pemasukan</label>
                
                <input type="radio" id="tipePengeluaran" name="tipeTransaksi" value="pengeluaran">
                <label for="tipePengeluaran" class="label-pengeluaran">- Pengeluaran</label>
            </div>

            <!-- INPUT TANGGAL -->
            <div class="input-group">
                <input type="date" id="tanggalTransaksi" required>
            </div>

            <div class="input-group">
                <input type="text" id="keterangan" placeholder="Keterangan (Misal: Beli Es krim)" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="text" id="nominal" placeholder="Nominal (Rp)" required autocomplete="off">
            </div>
            <button type="submit" class="btn-simpan">Simpan Transaksi</button>
        </form>
    </div>

    <div class="tabel-container">
        <h3>Riwayat Transaksi</h3>
        <div class="tabel" id="daftarTransaksi">
        </div>
    </div>
  
    <div id="modalHapus" class="modal-overlay">
        <div class="modal-card">
            <h4>Hapus Transaksi?</h4>
            <p>Catatan transaksi ini akan dihapus permanen.</p>
            <div class="modal-buttons">
                <button id="btnBatalHapus" class="btn-batal">Batal</button>
                <button id="btnKonfirmasiHapus" class="btn-hapus-konfirm">Hapus</button>
            </div>
        </div>
    </div>

    <script src="keuangan.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#tanggalTransaksi", {
        dateFormat: "Y-m-d",
        defaultDate: "today",
        disableMobile: "true"
    });
</script>

</body>
</html>
